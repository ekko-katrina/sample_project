// 通用可路由消息（与 vehicle-command Go SDK universal_message.proto 一致）
// 顶层类型为 RoutableMessage，见 protocol.md "Message encoding"。
// BLE 收发时在消息前加 2 字节大端长度；发往 VCSEC 的 payload 解析为 VCSEC.UnsignedMessage。
syntax = "proto3";

package UniversalMessage;

option go_package = "github.com/teslamotors/vehicle-command/pkg/protocol/protobuf/universalmessage";
option java_package = "com.tesla.generated.universalmessage";

import "signatures.proto";

// 目标域：车辆子系统，各有独立公钥与握手状态
// VCSEC 控制锁、远程启动、后备箱等，休眠时也可通过 BLE 访问；Infotainment 处理其余命令
enum Domain {
    DOMAIN_BROADCAST = 0;
    DOMAIN_VEHICLE_SECURITY = 2;  // VCSEC
    DOMAIN_INFOTAINMENT = 3;
}

// 目标：域枚举或 16 字节路由地址（随机生成，用于关联连接与响应）
// 车辆在响应中会交换 to/from
message Destination {
    oneof sub_destination{
        Domain domain            = 1;
        bytes  routing_address   = 2;
    }
}

enum OperationStatus_E
{
    OPERATIONSTATUS_OK = 0;
    OPERATIONSTATUS_WAIT = 1;
    OPERATIONSTATUS_ERROR = 2;
}

// 消息故障码：协议层错误，由车辆在 signedMessageStatus 中返回
// 应用层错误在 protobuf_message_as_bytes 内（如 VCSEC CommandStatus）
enum MessageFault_E
{
    MESSAGEFAULT_ERROR_NONE = 0;  // 请求成功
    MESSAGEFAULT_ERROR_BUSY = 1;  // 车辆子系统忙，请重试
    MESSAGEFAULT_ERROR_TIMEOUT = 2;  // 子系统未响应，请重试
    MESSAGEFAULT_ERROR_UNKNOWN_KEY_ID = 3;  // 车辆未识别该密钥，请确认已配对
    MESSAGEFAULT_ERROR_INACTIVE_KEY = 4;  // 该密钥已被禁用
    MESSAGEFAULT_ERROR_INVALID_SIGNATURE = 5;  // 签名/MAC 错误，请用返回的 session info 更新会话后重试
    MESSAGEFAULT_ERROR_INVALID_TOKEN_OR_COUNTER = 6;  // 防重放计数已用过，请更新 session 后重试
    MESSAGEFAULT_ERROR_INSUFFICIENT_PRIVILEGES = 7;  // 无权限（角色或车辆状态）
    MESSAGEFAULT_ERROR_INVALID_DOMAINS = 8;  // 命令格式错误或发往不可识别的域（客户端或固件过旧）
    MESSAGEFAULT_ERROR_INVALID_COMMAND = 9;  // 未识别的命令（客户端或固件不支持）
    MESSAGEFAULT_ERROR_DECODING = 10;  // 无法解析命令，多为客户端错误
    MESSAGEFAULT_ERROR_INTERNAL = 11;  // 车辆内部错误，请重试（常见于车辆未完全启动）
    MESSAGEFAULT_ERROR_WRONG_PERSONALIZATION = 12;  // 命令发往了错误的 VIN
    MESSAGEFAULT_ERROR_BAD_PARAMETER = 13;  // 参数错误或已废弃
    MESSAGEFAULT_ERROR_KEYCHAIN_IS_FULL = 14;  // 密钥链已满，需先删除密钥
    MESSAGEFAULT_ERROR_INCORRECT_EPOCH = 15;  // Session 不匹配，请用返回的 session info 更新
    MESSAGEFAULT_ERROR_IV_INCORRECT_LENGTH = 16;  // IV 长度错误（AES-GCM 应为 12 字节）
    MESSAGEFAULT_ERROR_TIME_EXPIRED = 17;  // 命令已过期，请根据 session 检查时钟
    MESSAGEFAULT_ERROR_NOT_PROVISIONED_WITH_IDENTITY = 18;  // 车辆未配置 VIN，可能需送修
    MESSAGEFAULT_ERROR_COULD_NOT_HASH_METADATA = 19;  // 车辆内部错误
    MESSAGEFAULT_ERROR_TIME_TO_LIVE_TOO_LONG = 20;  // 过期时间过远，安全拒绝
    MESSAGEFAULT_ERROR_REMOTE_ACCESS_DISABLED = 21;  // 车主已禁用远程访问
    MESSAGEFAULT_ERROR_REMOTE_SERVICE_ACCESS_DISABLED = 22;  // 服务密钥未允许远程服务命令
    MESSAGEFAULT_ERROR_COMMAND_REQUIRES_ACCOUNT_CREDENTIALS = 23;  // 需 Tesla 账户凭证，请经 Fleet API 重发
    MESSAGEFAULT_ERROR_REQUEST_MTU_EXCEEDED = 24;  // 请求字段超过 MTU
    MESSAGEFAULT_ERROR_RESPONSE_MTU_EXCEEDED = 25;  // 请求已收到，但响应超过 MTU
    MESSAGEFAULT_ERROR_REPEATED_COUNTER = 26;
    MESSAGEFAULT_ERROR_INVALID_KEY_HANDLE = 27;
    MESSAGEFAULT_ERROR_REQUIRES_RESPONSE_ENCRYPTION = 28;
}

message MessageStatus
{
    OperationStatus_E operation_status = 1;
    MessageFault_E signed_message_fault = 2;
}

// 会话信息请求：握手时由客户端发送，携带公钥与 challenge
// 见 protocol.md "Request"
message SessionInfoRequest
{
    bytes public_key = 1;  // ENCODE_PUBLIC(C)，65 字节
    bytes challenge = 2;   // 随机字节（如 16 字节），用于响应认证
}

enum Flags {
    FLAG_USER_COMMAND = 0;
    FLAG_ENCRYPT_RESPONSE = 1;  // 请求车辆加密响应（2024.38+ 固件支持）
}

// 可路由消息：顶层协议消息
// to_destination：命令发往的域；from_destination：客户端 16 字节路由地址（车辆响应中会交换）
// payload：protobuf_message_as_bytes 为应用负载（VCSEC 时为 VCSEC.UnsignedMessage）；或 session_info_request / session_info
// uuid：最多 16 字节，需不可预测以防重放；响应中可能通过 request_uuid 回显（VCSEC 常因内存不填）
message RoutableMessage {
    reserved 1 to 5;
    reserved 16 to 40;
    reserved 11;
    Destination to_destination = 6;
    Destination from_destination = 7;

    oneof payload {
        bytes protobuf_message_as_bytes = 10;  // 密文或明文应用负载
        SessionInfoRequest session_info_request = 14;  // 握手请求
        bytes session_info = 15;                // 握手响应（解码为 Signatures.SessionInfo）
    }

    oneof sub_sigData {
        Signatures.SignatureData signature_data = 13;
    }

    MessageStatus signedMessageStatus = 12;  // 协议层错误时由车辆填充
    bytes request_uuid           = 50;  // 响应中回显请求的 uuid（若存在）
    bytes uuid                   = 51;
    uint32 flags = 52;  // 位掩码，车辆会验证但忽略未知位
}
